name: LDManager
options:
  bundleIdPrefix: io.github.roeehrl
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  LDManagerPackage:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  LDManager:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: LDManagerPackage
        product: LDCore
    settings:
      base:
        PRODUCT_NAME: LD Manager
        PRODUCT_BUNDLE_IDENTIFIER: io.github.roeehrl.ldmanager
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LD Manager
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "LD Manager asks macOS for administrator rights to manage system daemons."
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
