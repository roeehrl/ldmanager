name: Idea or feature request
description: A new check, view, CLI option or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and the launchd job involved, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
