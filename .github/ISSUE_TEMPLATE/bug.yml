name: Bug report
description: Something LD Manager or ldm gets wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Select the job …\n2. Click …"
  - type: textarea
    id: show
    attributes:
      label: "Output of `ldm show <job> --json`"
      description: Check it for anything private (usernames, hostnames, paths) and redact it first.
      render: json
  - type: input
    id: versions
    attributes:
      label: macOS and LD Manager versions
      placeholder: "macOS 26.4, LD Manager 0.1.0 (or commit)"
    validations:
      required: true
